<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Audio Particle Template</title>
<style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #06060f; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #clock {
        position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%);
        color: #fff; font-family: "Segoe UI", sans-serif; font-weight: 200;
        font-size: 9vmin; letter-spacing: .05em; text-shadow: 0 0 24px rgba(255,255,255,.35);
        user-select: none;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<script>
"use strict";

/* ============ Wallpaper Engine 接线 ============
 * applyUserProperties 在页面加载后异步触发，且每次用户改动都会重新触发，
 * 所以这里只更新状态变量，渲染循环始终读取最新值。 */

const state = {
    color: [0.55, 0.40, 0.95], // schemecolor，"R G B" 0~1 字符串
    amount: 300,
    showClock: true,
    mode: "pulse",
    fpsCap: 60
};

window.wallpaperPropertyListener = {
    applyUserProperties: function (p) {
        if (p.schemecolor) {
            state.color = p.schemecolor.value.split(" ").map(parseFloat);
        }
        if (p.amount) rebuild(Math.round(p.amount.value));
        if (p.showclock) {
            state.showClock = p.showclock.value;
            document.getElementById("clock").style.display = state.showClock ? "" : "none";
        }
        if (p.mode) state.mode = p.mode.value;
    },
    applyGeneralProperties: function (p) {
        if (p.fps) state.fpsCap = p.fps;
    }
};

/* 音频监听：引擎内用真实数据；普通浏览器打开时用假数据便于调试 */
const audio = { level: 0, bands: new Float32Array(32) };

if (window.wallpaperRegisterAudioListener) {
    window.wallpaperRegisterAudioListener(function (arr) {
        // 128 个浮点：0-63 左声道，64-127 右声道；典型 0~1，可 >1，先 clamp
        let sum = 0;
        for (let i = 0; i < 32; i++) {
            const l = Math.min(1, arr[i]);
            const r = Math.min(1, arr[64 + i]);
            const v = (l + r) / 2;
            audio.bands[i] = v;
            sum += v;
        }
        audio.level = sum / 32;
    });
} else {
    // 浏览器调试模式：模拟音频数据
    setInterval(function () {
        let sum = 0;
        for (let i = 0; i < 32; i++) {
            audio.bands[i] = Math.max(0, audio.bands[i] * 0.8 + Math.random() * 0.35);
            sum += audio.bands[i];
        }
        audio.level = sum / 32;
    }, 50);
}

/* ============ 粒子渲染 ============ */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H, particles = [];

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function rebuild(n) {
    particles = [];
    for (let i = 0; i < n; i++) {
        particles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: 0.6 + Math.random() * 2.2,
            vx: (Math.random() - 0.5) * 0.25,
            vy: -0.15 - Math.random() * 0.5,
            tw: Math.random() * Math.PI * 2   // 闪烁相位
        });
    }
}
rebuild(state.amount);

let lastT = 0;
function frame(t) {
    requestAnimationFrame(frame);
    if (t - lastT < 1000 / state.fpsCap - 1) return;
    lastT = t;

    // 无声时音频值自然衰减，避免画面冻在最后一帧
    audio.level *= 0.95;
    for (let i = 0; i < 32; i++) audio.bands[i] *= 0.95;

    ctx.fillStyle = "rgba(6, 6, 15, 0.28)";   // 拖尾
    ctx.fillRect(0, 0, W, H);

    const [cr, cg, cb] = state.color;
    const boost = state.mode === "pulse" ? 1 + audio.level * 2.2
                                         : 1 + audio.bands[4] * 2.0;
    const bass  = state.mode === "wave"  ? audio.bands[0] : audio.level;

    for (const p of particles) {
        p.x += p.vx * boost;
        p.y += p.vy * boost;
        if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
        if (p.x < -5) p.x = W + 5;
        if (p.x > W + 5) p.x = -5;

        p.tw += 0.03;
        const alpha = 0.35 + 0.45 * Math.abs(Math.sin(p.tw)) + bass * 0.5;
        const radius = p.r * boost;
        ctx.beginPath();
        ctx.fillStyle = "rgba(" + Math.round(cr * 255) + "," +
                                 Math.round(cg * 255) + "," +
                                 Math.round(cb * 255) + "," +
                                 Math.min(1, alpha).toFixed(3) + ")";
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fill();
    }
}
requestAnimationFrame(frame);

/* ============ 时钟 ============ */

function tickClock() {
    const d = new Date();
    document.getElementById("clock").textContent =
        String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
setInterval(tickClock, 1000);
tickClock();
</script>
</body>
</html>
